<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedPortal — Личный кабинет</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="img/icons/heartbeat.png">
</head>
<body data-guard="auth">
  <div class="phone">

    <!-- Шапка -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo"><img src="img/icons/heartbeat.png" alt=""></div>
        <div>
          <div class="brand-name">MedPortal</div>
          <div class="brand-tag">Личный кабинет</div>
        </div>
      </div>
      <div class="page-title">Профиль пациента</div>
    </header>

    <main class="app-main">

      <!-- Шапка профиля -->
      <section class="card">
        <div class="profile-head">
          <div class="avatar"><img src="img/icons/user.png" alt=""></div>
          <div style="flex:1;min-width:0">
            <div class="name" id="userName">Пациент</div>
            <div class="meta" id="userEmail">—</div>
          </div>
          <button class="btn btn-sm btn-danger" id="logoutBtn" style="width:auto;padding:8px 12px">
            <img src="img/icons/logout.png" alt="" style="width:14px;height:14px;filter:brightness(0) saturate(100%) invert(35%) sepia(60%) saturate(2300%) hue-rotate(335deg) brightness(98%) contrast(91%)">
          </button>
        </div>

        <div class="stat-grid mt-12" style="margin-top:14px">
          <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Всего приёмов</div></div>
          <div class="stat"><div class="num" id="statDone">0</div><div class="lbl">Завершено</div></div>
          <div class="stat"><div class="num" id="statWait">0</div><div class="lbl">Предстоит</div></div>
        </div>
      </section>

      <!-- Быстрая запись -->
      <a href="application.html" class="btn btn-primary" style="text-decoration:none">
        <img src="img/icons/add.png" alt="" style="width:18px;height:18px;filter:brightness(0) invert(1)"> Записаться на приём
      </a>

      <!-- История приёмов -->
      <section>
        <div class="flex-between mb-0" style="margin-bottom:10px">
          <h2 style="font-size:15px">История приёмов</h2>
          <span class="text-sm muted" id="countInfo"></span>
        </div>
        <div class="app-list" id="eventsList"></div>
      </section>

    </main>

    <!-- Нижняя навигация -->
    <nav class="tabbar">
      <a href="index.html"><img src="img/icons/home.png" alt=""><span>Главная</span></a>
      <a href="application.html"><img src="img/icons/add.png" alt=""><span>Запись</span></a>
      <a href="profile.html" class="active"><img src="img/icons/user.png" alt=""><span>Кабинет</span></a>
      <a href="admin.html"><img src="img/icons/filter.png" alt=""><span>Админ</span></a>
    </nav>
  </div>

  <script src="js/validation.js"></script>
  <script>
  (function(){
    'use strict';

    // Демонстрационная история приёмов пациента.
    // finished === true → приём завершён, доступна кнопка «Оставить отзыв».
    const events = [
      { id: 'v1', doctor: 'Иванова Анна Петровна', specialty: 'Терапевт',
        date: '2026-11-10', time: '10:30', finished: true,
        review: { rating: 5, text: 'Внимательный врач, всё подробно объяснила.' } },
      { id: 'v2', doctor: 'Петров Сергей Иванович', specialty: 'Кардиолог',
        date: '2026-11-25', time: '14:00', finished: false, review: null },
      { id: 'v3', doctor: 'Козлов Дмитрий Алексеевич', specialty: 'Невролог',
        date: '2026-10-28', time: '09:00', finished: true, review: null },
      { id: 'v4', doctor: 'Смирнова Елена Сергеевна', specialty: 'Кардиолог',
        date: '2026-12-02', time: '12:00', finished: false, review: null }
    ];

    function fmtDate(iso) {
      const [y, m, d] = iso.split('-');
      return d + '.' + m + '.' + y;
    }

    const STATUS = {
      done: { title: 'Завершён', cls: 'badge-success' },
      wait: { title: 'Предстоит', cls: 'badge-waiting' }
    };

    function starsHtml(rating, idAttr) {
      let html = '<div class="stars" data-id="' + idAttr + '">';
      for (let i = 1; i <= 5; i++) {
        html += '<img src="img/icons/star.png" alt="" data-rate="' + i + '" class="' + (i <= rating ? 'active' : '') + '">';
      }
      html += '</div>';
      return html;
    }

    function render() {
      const list = document.getElementById('eventsList');
      if (!list) return;

      // Сортируем по дате убывания
      const sorted = events.slice().sort((a, b) => b.date.localeCompare(a.date));

      list.innerHTML = sorted.map(ev => {
        const st = ev.finished ? STATUS.done : STATUS.wait;
        let body = '';

        if (ev.finished && ev.review) {
          // Уже есть отзыв
          body = `
            <div class="review-block">
              <div class="text-sm" style="color:var(--text);font-weight:600">Ваш отзыв:</div>
              ${starsHtml(ev.review.rating, ev.id)}
              <div class="text-sm muted" style="margin-top:4px">${escapeHtml(ev.review.text)}</div>
            </div>`;
        } else if (ev.finished && !ev.review) {
          // Можно оставить отзыв
          body = `
            <div class="review-block" data-review-block="${ev.id}">
              <div class="text-sm" style="color:var(--text);font-weight:600">Оцените приём:</div>
              ${starsHtml(0, ev.id)}
              <textarea class="mt-8" id="reviewText-${ev.id}" placeholder="Поделитесь впечатлениями о враче" maxlength="500"></textarea>
              <button class="btn btn-secondary btn-sm mt-8" data-submit-review="${ev.id}" style="width:100%">Оставить отзыв</button>
            </div>`;
        } else {
          // Приём не завершён — отзыв недоступен
          body = `
            <div class="review-block">
              <div class="locked-note">
                <img src="img/icons/close.png" alt="">
                Отзыв станет доступен после завершения приёма
              </div>
            </div>`;
        }

        return `
          <article class="event-card">
            <div class="head">
              <div>
                <div class="doctor">${escapeHtml(ev.doctor)}</div>
                <div class="spec">${escapeHtml(ev.specialty)}</div>
              </div>
              <span class="badge ${st.cls}">${st.title}</span>
            </div>
            <div class="meta-row">
              <span><img src="img/icons/calendar.png" alt=""> ${fmtDate(ev.date)}</span>
              <span>🕒 ${ev.time}</span>
            </div>
            ${body}
          </article>`;
      }).join('');

      // Статистика
      document.getElementById('statTotal').textContent = events.length;
      document.getElementById('statDone').textContent = events.filter(e => e.finished).length;
      document.getElementById('statWait').textContent = events.filter(e => !e.finished).length;
      document.getElementById('countInfo').textContent = 'Всего: ' + events.length;

      bindStars();
    }

    function bindStars() {
      document.querySelectorAll('.stars img').forEach(star => {
        star.addEventListener('click', () => {
          const wrap = star.parentElement;
          const rate = parseInt(star.dataset.rate, 10);
          wrap.querySelectorAll('img').forEach((s, i) => {
            s.classList.toggle('active', i < rate);
          });
          wrap.dataset.selected = rate;
        });
      });

      document.querySelectorAll('[data-submit-review]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.submitReview;
          const wrap = document.querySelector(`.stars[data-id="${id}"]`);
          const rate = wrap ? parseInt(wrap.dataset.selected || '0', 10) : 0;
          const text = document.getElementById('reviewText-' + id).value.trim();

          if (rate === 0) {
            window.MedPortal.toast('Поставьте оценку', 'error');
            return;
          }
          if (text.length < 5) {
            window.MedPortal.toast('Напишите отзыв (минимум 5 символов)', 'error');
            return;
          }

          const ev = events.find(e => e.id === id);
          ev.review = { rating: rate, text };
          window.MedPortal.toast('Спасибо за отзыв!', 'success');
          render();
        });
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    document.addEventListener('DOMContentLoaded', () => {
      render();
      const lo = document.getElementById('logoutBtn');
      if (lo) lo.addEventListener('click', () => {
        window.MedPortal.clearSession();
        window.MedPortal.toast('Вы вышли из системы', 'success');
        setTimeout(() => location.href = 'login.html', 700);
      });
    });
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedPortal — Панель администратора</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="img/icons/heartbeat.png">
</head>
<body>
  <div class="phone">

    <!-- Шапка -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo"><img src="img/icons/filter.png" alt=""></div>
        <div>
          <div class="brand-name">MedPortal · Admin</div>
          <div class="brand-tag">Управление заявками</div>
        </div>
      </div>
      <div class="page-title">Панель администратора</div>
    </header>

    <main class="app-main">

      <!-- Статистика -->
      <section class="card">
        <h2>Сводка по заявкам</h2>
        <div class="stat-grid mt-12" style="margin-top:10px">
          <div class="stat"><div class="num" id="kpiTotal">0</div><div class="lbl">Всего</div></div>
          <div class="stat"><div class="num" id="kpiWait">0</div><div class="lbl">Ожидают</div></div>
          <div class="stat"><div class="num" id="kpiDone">0</div><div class="lbl">Завершены</div></div>
        </div>
      </section>

      <!-- Фильтры -->
      <section class="card">
        <div class="flex-between mb-0" style="margin-bottom:10px">
          <h2 style="font-size:15px">Фильтры</h2>
          <button class="btn btn-sm btn-ghost" id="resetBtn" style="width:auto;padding:6px 12px">Сбросить</button>
        </div>

        <div class="filters">
          <!-- Поиск -->
          <div class="search-wrap field" style="margin:0">
            <img src="img/icons/search.png" alt="">
            <input type="text" id="q" placeholder="Поиск по пациенту, № заявки, врачу…">
          </div>

          <!-- Чипы статусов -->
          <div class="chip-row">
            <div class="chip active" data-status="">Все</div>
            <div class="chip" data-status="waiting">Ожидают</div>
            <div class="chip" data-status="done">Завершены</div>
            <div class="chip" data-status="cancelled">Отменены</div>
          </div>

          <!-- Скрытый селект статуса (синхронизируется с чипами) -->
          <select id="fStatus" class="hide">
            <option value="">Все статусы</option>
            <option value="waiting">Ожидают</option>
            <option value="done">Завершены</option>
            <option value="cancelled">Отменены</option>
          </select>

          <!-- Спец + Врач -->
          <div class="row">
            <select id="fSpecialty"><option value="">Все спец.</option></select>
            <select id="fDoctor" disabled><option value="">Все врачи</option></select>
          </div>

          <!-- Диапазон дат -->
          <div class="row">
            <input type="date" id="fDateFrom" title="Дата с">
            <input type="date" id="fDateTo" title="Дата по">
          </div>
        </div>
      </section>

      <!-- Список заявок -->
      <section>
        <div class="flex-between mb-0" style="margin-bottom:10px">
          <h2 style="font-size:15px">Заявки</h2>
          <span class="text-sm muted" id="countInfo"></span>
        </div>
        <div class="app-list" id="appList"></div>
      </section>

    </main>

    <!-- Нижняя навигация -->
    <nav class="tabbar">
      <a href="index.html"><img src="img/icons/home.png" alt=""><span>Главная</span></a>
      <a href="application.html"><img src="img/icons/add.png" alt=""><span>Запись</span></a>
      <a href="profile.html"><img src="img/icons/user.png" alt=""><span>Кабинет</span></a>
      <a href="admin.html" class="active"><img src="img/icons/filter.png" alt=""><span>Админ</span></a>
    </nav>
  </div>

  <script src="js/validation.js"></script>
  <script src="js/admin-filter.js"></script>
  <script>
  // Обновление KPI при каждой фильтрации.
  // Слушаем событие medportal:filtered, которое генерирует admin-filter.js
  // после каждого рендера списка. Дополнительно используем MutationObserver
  // для подстраховки (первый рендер и любой последующий).
  (function(){
    function updateKpi() {
      const list = document.querySelectorAll('#appList .app-card');
      let wait = 0, done = 0;
      list.forEach(c => {
        const b = c.querySelector('.badge');
        if (!b) return;
        if (b.classList.contains('badge-waiting')) wait++;
        if (b.classList.contains('badge-success')) done++;
      });
      const t = document.getElementById('kpiTotal'); if (t) t.textContent = list.length;
      const w = document.getElementById('kpiWait');  if (w) w.textContent = wait;
      const d = document.getElementById('kpiDone');  if (d) d.textContent = done;
    }
    document.addEventListener('DOMContentLoaded', () => {
      const target = document.getElementById('appList');
      if (target) {
        // Первый рендер + последующие изменения
        new MutationObserver(() => {
          // небольшой debounce, чтобы не дёргаться при массовом обновлении
          clearTimeout(window._kpiT);
          window._kpiT = setTimeout(updateKpi, 50);
        }).observe(target, { childList: true, subtree: true });
      }
      // Дёргаем вручную — на случай, если admin-filter.js уже отрисовал
      updateKpi();
    });
    // Реакция на событие фильтрации (если поддерживается)
    document.addEventListener('medportal:filtered', updateKpi);
  })();
  </script>
</body>
</html>

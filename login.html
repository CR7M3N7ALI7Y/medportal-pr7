<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedPortal — Авторизация</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="img/icons/heartbeat.png">
</head>
<body>
  <div class="phone">

    <!-- Шапка -->
    <header class="app-header">
      <a href="index.html" style="color:#fff;text-decoration:none;font-size:13px;display:inline-flex;align-items:center;gap:4px;margin-bottom:8px">
        <img src="img/icons/close.png" alt="" style="width:14px;height:14px;filter:brightness(0) invert(1)"> На главную
      </a>
      <div class="brand">
        <div class="brand-logo"><img src="img/icons/heartbeat.png" alt=""></div>
        <div>
          <div class="brand-name">MedPortal</div>
          <div class="brand-tag">Вход в личный кабинет</div>
        </div>
      </div>
    </header>

    <main class="app-main">

      <section class="card">
        <h2>Вход</h2>
        <p class="card-subtitle">Введите email и пароль для входа</p>

        <form id="loginForm" novalidate>

          <div class="field">
            <label for="email">Email <span class="req">*</span></label>
            <input type="email" id="email" name="email" placeholder="you@example.ru" autocomplete="email">
            <span class="error" id="emailError"></span>
          </div>

          <div class="field">
            <label for="password">Пароль <span class="req">*</span></label>
            <input type="password" id="password" name="password" placeholder="Ваш пароль" autocomplete="current-password">
            <span class="error" id="passwordError"></span>
          </div>

          <div class="flex-between mt-8" style="margin-bottom:12px">
            <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted)">
              <input type="checkbox" id="remember" style="width:auto"> Запомнить меня
            </label>
            <a href="#" class="link text-sm" style="font-size:12px">Забыли пароль?</a>
          </div>

          <button type="submit" class="btn btn-primary">Войти</button>
        </form>

        <div class="form-footer mt-12">
          Нет аккаунта? <a href="register.html" class="link">Зарегистрироваться</a>
        </div>
      </section>

      <div class="card" style="background:var(--primary-light);border-color:transparent">
        <div style="display:flex;gap:10px;align-items:flex-start">
          <img src="img/icons/user.png" alt="" style="width:20px;height:20px">
          <div>
            <div style="font-size:13px;font-weight:700;color:var(--primary-dark)">Демо-доступ</div>
            <div class="text-sm muted" style="margin-top:4px">Сначала зарегистрируйтесь — данные сохранятся в браузере (localStorage).</div>
          </div>
        </div>
      </div>

    </main>
  </div>
  <script src="js/validation.js"></script>
</body>
</html>
